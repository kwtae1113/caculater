<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>전국 날씨 지도</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #69758a;
      --line: #dce4ef;
      --accent: #1677ff;
      --accent-strong: #0b5bd3;
      --map-fill: #d9eadb;
      --map-fill-hover: #b9dcbe;
      --map-fill-active: #1677ff;
      --shadow: 0 18px 50px rgba(31, 43, 71, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(244,247,251,0.96)),
        radial-gradient(circle at top left, rgba(63,140,255,0.16), transparent 34%),
        var(--bg);
      color: var(--ink);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .updated {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      white-space: nowrap;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(330px, 0.7fr);
      gap: 18px;
      align-items: stretch;
    }

    .map-shell,
    .weather-panel {
      overflow: hidden;
      border: 1px solid rgba(220,228,239,0.9);
      border-radius: 8px;
      background: rgba(255,255,255,0.9);
      box-shadow: var(--shadow);
    }

    .map-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.76);
    }

    .map-title {
      font-weight: 900;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .map-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 160px;
      gap: 0;
      min-height: 680px;
      background:
        linear-gradient(155deg, rgba(229,245,255,0.96), rgba(242,249,255,0.98) 44%, rgba(235,245,255,0.96)),
        repeating-linear-gradient(0deg, rgba(22,119,255,0.055) 0 1px, transparent 1px 42px),
        repeating-linear-gradient(90deg, rgba(22,119,255,0.05) 0 1px, transparent 1px 42px);
    }

    .map-canvas {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 18px;
    }

    .korea-map {
      width: min(100%, 620px);
      height: auto;
      max-height: 640px;
      filter: drop-shadow(0 18px 22px rgba(55, 91, 126, 0.14));
    }

    .province {
      fill: var(--map-fill);
      stroke: #ffffff;
      stroke-width: 1.45;
      cursor: pointer;
      transition: fill 160ms ease, stroke 160ms ease, filter 160ms ease;
    }

    .province:hover {
      fill: var(--map-fill-hover);
      stroke: #3b8cf4;
      filter: brightness(1.02);
    }

    .province.active {
      fill: var(--map-fill-active);
      stroke: #0b5bd3;
    }

    .province-label {
      pointer-events: none;
      fill: #203047;
      font-size: 11px;
      font-weight: 900;
      text-anchor: middle;
      paint-order: stroke;
      stroke: rgba(255,255,255,0.86);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .province-label.active {
      fill: #ffffff;
      stroke: rgba(0,63,151,0.5);
    }

    .map-status {
      position: absolute;
      inset: auto 18px 18px;
      padding: 10px 12px;
      border: 1px solid rgba(220,228,239,0.9);
      border-radius: 8px;
      background: rgba(255,255,255,0.88);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .region-list {
      display: grid;
      align-content: start;
      gap: 7px;
      padding: 14px;
      border-left: 1px solid rgba(220,228,239,0.9);
      background: rgba(255,255,255,0.72);
      overflow: auto;
    }

    .region-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      background: #fff;
      color: #26364f;
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
    }

    .region-button:hover,
    .region-button.active {
      border-color: rgba(22,119,255,0.35);
      background: #edf5ff;
      color: var(--accent-strong);
    }

    .weather-panel {
      display: flex;
      flex-direction: column;
      min-height: 680px;
    }

    .current {
      padding: 22px;
      border-bottom: 1px solid var(--line);
    }

    .region-name {
      margin: 0 0 4px;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .weather-state {
      color: var(--muted);
      font-weight: 800;
    }

    .temperature-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
    }

    .weather-icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      border-radius: 8px;
      background: #eef6ff;
      font-size: 42px;
      line-height: 1;
    }

    .temperature {
      font-size: 56px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
    }

    .feels {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .metric {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfdff;
    }

    .metric span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      font-size: 18px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding: 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fbff;
    }

    .tab {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 12px;
      background: transparent;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
    }

    .tab.active {
      border-color: rgba(22,119,255,0.28);
      background: #fff;
      color: var(--accent-strong);
      box-shadow: 0 8px 20px rgba(24, 54, 90, 0.08);
    }

    .tab-view {
      display: none;
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .tab-view.active {
      display: block;
    }

    .today-list,
    .forecast-list {
      display: grid;
      gap: 10px;
    }

    .detail-row,
    .forecast-row {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .time {
      color: var(--muted);
      font-weight: 900;
      font-size: 13px;
    }

    .small-state {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .small-state b {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status {
      display: grid;
      place-items: center;
      min-height: 210px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }

    .error {
      color: #c2410c;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .map-area,
      .weather-panel {
        min-height: 560px;
      }

      .weather-panel {
        min-height: auto;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 20px, 1180px);
        padding: 18px 0;
      }

      header,
      .map-toolbar {
        align-items: start;
        flex-direction: column;
      }

      .updated {
        text-align: left;
        white-space: normal;
      }

      .map-area {
        grid-template-columns: 1fr;
      }

      .region-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        border-top: 1px solid rgba(220,228,239,0.9);
        border-left: 0;
        max-height: none;
      }

      .region-button {
        text-align: center;
      }

      .korea-map {
        max-height: 520px;
      }

      .current {
        padding: 18px;
      }

      .temperature {
        font-size: 44px;
      }

      .weather-icon {
        width: 64px;
        height: 64px;
        font-size: 34px;
      }

      .metrics {
        grid-template-columns: 1fr;
      }

      .detail-row,
      .forecast-row {
        grid-template-columns: 70px 1fr;
      }

      .chip {
        grid-column: 2;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>전국 날씨 지도</h1>
        <p class="subtitle">실제 시도 경계 지도를 클릭하면 오늘 날씨와 1주일 예보를 확인할 수 있습니다.</p>
      </div>
      <div class="updated" id="updatedText">데이터 대기 중</div>
    </header>

    <section class="layout" aria-label="전국 날씨">
      <div class="map-shell">
        <div class="map-toolbar">
          <div class="map-title">대한민국 시도 경계 지도</div>
          <div class="hint">통계청 2018 시도 경계 데이터 기반</div>
        </div>
        <div class="map-area">
          <div class="map-canvas">
            <svg class="korea-map" id="koreaMap" viewBox="0 0 620 760" role="img" aria-label="대한민국 시도 경계 지도"></svg>
            <div class="map-status" id="mapStatus">지도 데이터를 불러오는 중입니다.</div>
          </div>
          <div class="region-list" id="regionList" aria-label="지역 목록"></div>
        </div>
      </div>

      <aside class="weather-panel" aria-label="선택 지역 날씨 상세">
        <div class="current" id="currentPanel">
          <h2 class="region-name">서울</h2>
          <div class="weather-state">날씨 정보를 불러오는 중입니다.</div>
          <div class="temperature-row">
            <div class="weather-icon">--</div>
            <div>
              <div class="temperature">--°</div>
              <div class="feels">체감 --°</div>
            </div>
          </div>
          <div class="metrics">
            <div class="metric"><span>습도</span><strong>--%</strong></div>
            <div class="metric"><span>바람</span><strong>-- km/h</strong></div>
            <div class="metric"><span>강수량</span><strong>-- mm</strong></div>
            <div class="metric"><span>강수확률</span><strong>--%</strong></div>
          </div>
        </div>

        <div class="tabs" role="tablist" aria-label="예보 보기">
          <button class="tab active" type="button" data-tab="today" role="tab" aria-selected="true">오늘 상세</button>
          <button class="tab" type="button" data-tab="week" role="tab" aria-selected="false">1주일 예보</button>
        </div>

        <div class="tab-view active" id="todayView" role="tabpanel">
          <div class="status">오늘 시간대별 예보를 불러오는 중입니다.</div>
        </div>
        <div class="tab-view" id="weekView" role="tabpanel">
          <div class="status">1주일 예보를 불러오는 중입니다.</div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const MAP_DATA_URL = "https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-topo-simple.json";

    const regions = [
      { name: "서울", fullName: "서울특별시", lat: 37.5665, lon: 126.9780 },
      { name: "부산", fullName: "부산광역시", lat: 35.1796, lon: 129.0756 },
      { name: "대구", fullName: "대구광역시", lat: 35.8714, lon: 128.6014 },
      { name: "인천", fullName: "인천광역시", lat: 37.4563, lon: 126.7052 },
      { name: "광주", fullName: "광주광역시", lat: 35.1595, lon: 126.8526 },
      { name: "대전", fullName: "대전광역시", lat: 36.3504, lon: 127.3845 },
      { name: "울산", fullName: "울산광역시", lat: 35.5384, lon: 129.3114 },
      { name: "세종", fullName: "세종특별자치시", lat: 36.4800, lon: 127.2890 },
      { name: "경기", fullName: "경기도", lat: 37.4138, lon: 127.5183 },
      { name: "강원", fullName: "강원도", lat: 37.8228, lon: 128.1555 },
      { name: "충북", fullName: "충청북도", lat: 36.6357, lon: 127.4913 },
      { name: "충남", fullName: "충청남도", lat: 36.5184, lon: 126.8000 },
      { name: "전북", fullName: "전라북도", lat: 35.7175, lon: 127.1530 },
      { name: "전남", fullName: "전라남도", lat: 34.8679, lon: 126.9910 },
      { name: "경북", fullName: "경상북도", lat: 36.4919, lon: 128.8889 },
      { name: "경남", fullName: "경상남도", lat: 35.4606, lon: 128.2132 },
      { name: "제주", fullName: "제주특별자치도", lat: 33.4996, lon: 126.5312 }
    ];

    const weatherCodes = {
      0: ["맑음", "☀"],
      1: ["대체로 맑음", "☀"],
      2: ["구름 조금", "◐"],
      3: ["흐림", "☁"],
      45: ["안개", "≋"],
      48: ["짙은 안개", "≋"],
      51: ["약한 이슬비", "☂"],
      53: ["이슬비", "☂"],
      55: ["강한 이슬비", "☂"],
      61: ["약한 비", "☂"],
      63: ["비", "☂"],
      65: ["강한 비", "☂"],
      71: ["약한 눈", "＊"],
      73: ["눈", "＊"],
      75: ["강한 눈", "＊"],
      80: ["약한 소나기", "☂"],
      81: ["소나기", "☂"],
      82: ["강한 소나기", "☔"],
      95: ["뇌우", "⚡"],
      96: ["우박 동반 뇌우", "⚡"],
      99: ["강한 우박 뇌우", "⚡"]
    };

    const regionByFullName = new Map(regions.map((region) => [region.fullName, region]));
    const currentPanel = document.querySelector("#currentPanel");
    const todayView = document.querySelector("#todayView");
    const weekView = document.querySelector("#weekView");
    const updatedText = document.querySelector("#updatedText");
    const regionList = document.querySelector("#regionList");
    const mapStatus = document.querySelector("#mapStatus");
    let selectedRegion = regions[0];

    function formatNumber(value, fallback = "--") {
      return Number.isFinite(value) ? Math.round(value).toString() : fallback;
    }

    function getWeatherInfo(code) {
      return weatherCodes[code] || ["정보 없음", "·"];
    }

    function formatHour(value) {
      const date = new Date(value);
      return date.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    }

    function formatDay(value) {
      const date = new Date(value + "T00:00:00");
      return date.toLocaleDateString("ko-KR", { weekday: "short", month: "numeric", day: "numeric" });
    }

    function buildRegionList() {
      regionList.innerHTML = regions.map((region) => `
        <button class="region-button" type="button" data-region="${region.name}" aria-label="${region.name} 날씨 보기">
          ${region.name}
        </button>
      `).join("");

      regionList.querySelectorAll(".region-button").forEach((button) => {
        button.addEventListener("click", () => {
          const region = regions.find((item) => item.name === button.dataset.region);
          if (region) {
            selectRegion(region);
          }
        });
      });
    }

    async function buildMap() {
      try {
        const response = await fetch(MAP_DATA_URL);
        if (!response.ok) {
          throw new Error("지도 데이터 응답 오류");
        }

        const topology = await response.json();
        const object = topology.objects.skorea_provinces_2018_geo;
        const collection = topojson.feature(topology, object);
        const projection = d3.geoMercator().fitExtent([[28, 18], [592, 728]], collection);
        const path = d3.geoPath(projection);
        const svg = d3.select("#koreaMap");
        const labelOffsets = {
          "서울특별시": [-8, -4],
          "인천광역시": [-13, 6],
          "세종특별자치시": [-5, 7],
          "대전광역시": [6, 9],
          "대구광역시": [10, 8],
          "울산광역시": [18, 8],
          "부산광역시": [13, 12],
          "광주광역시": [-5, 10],
          "제주특별자치도": [0, 4]
        };

        svg.selectAll("*").remove();

        svg.append("g")
          .selectAll("path")
          .data(collection.features)
          .join("path")
          .attr("class", (feature) => `province ${feature.properties.name === selectedRegion.fullName ? "active" : ""}`)
          .attr("d", path)
          .attr("data-region", (feature) => feature.properties.name)
          .attr("tabindex", 0)
          .attr("role", "button")
          .attr("aria-label", (feature) => `${regionByFullName.get(feature.properties.name)?.name || feature.properties.name} 날씨 보기`)
          .on("click", (_, feature) => {
            const region = regionByFullName.get(feature.properties.name);
            if (region) {
              selectRegion(region);
            }
          })
          .on("keydown", (event, feature) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              const region = regionByFullName.get(feature.properties.name);
              if (region) {
                selectRegion(region);
              }
            }
          })
          .append("title")
          .text((feature) => feature.properties.name);

        svg.append("g")
          .selectAll("text")
          .data(collection.features)
          .join("text")
          .attr("class", (feature) => `province-label ${feature.properties.name === selectedRegion.fullName ? "active" : ""}`)
          .attr("x", (feature) => path.centroid(feature)[0] + (labelOffsets[feature.properties.name]?.[0] || 0))
          .attr("y", (feature) => path.centroid(feature)[1] + (labelOffsets[feature.properties.name]?.[1] || 0))
          .text((feature) => regionByFullName.get(feature.properties.name)?.name || "");

        mapStatus.textContent = "지도 영역 또는 오른쪽 지역명을 클릭하세요.";
        setActiveMarker(selectedRegion);
      } catch (error) {
        mapStatus.innerHTML = '<span class="error">지도 데이터를 불러오지 못했습니다. 오른쪽 지역 목록으로 선택해 주세요.</span>';
      }
    }

    function setActiveMarker(region) {
      document.querySelectorAll(".province").forEach((path) => {
        path.classList.toggle("active", path.dataset.region === region.fullName);
      });
      document.querySelectorAll(".province-label").forEach((label) => {
        label.classList.toggle("active", label.textContent === region.name);
      });
      document.querySelectorAll(".region-button").forEach((button) => {
        button.classList.toggle("active", button.dataset.region === region.name);
      });
    }

    function setLoading(region) {
      currentPanel.innerHTML = `
        <h2 class="region-name">${region.name}</h2>
        <div class="weather-state">날씨 정보를 불러오는 중입니다.</div>
        <div class="temperature-row">
          <div class="weather-icon">--</div>
          <div>
            <div class="temperature">--°</div>
            <div class="feels">체감 --°</div>
          </div>
        </div>
        <div class="metrics">
          <div class="metric"><span>습도</span><strong>--%</strong></div>
          <div class="metric"><span>바람</span><strong>-- km/h</strong></div>
          <div class="metric"><span>강수량</span><strong>-- mm</strong></div>
          <div class="metric"><span>강수확률</span><strong>--%</strong></div>
        </div>
      `;
      todayView.innerHTML = `<div class="status">오늘 시간대별 예보를 불러오는 중입니다.</div>`;
      weekView.innerHTML = `<div class="status">1주일 예보를 불러오는 중입니다.</div>`;
    }

    function setError(region, message) {
      currentPanel.innerHTML = `
        <h2 class="region-name">${region.name}</h2>
        <div class="weather-state error">${message}</div>
        <div class="status">인터넷 연결 상태를 확인한 뒤 다시 지역을 클릭해 주세요.</div>
      `;
      todayView.innerHTML = `<div class="status error">${message}</div>`;
      weekView.innerHTML = `<div class="status error">${message}</div>`;
      updatedText.textContent = "데이터를 불러오지 못했습니다.";
    }

    function renderCurrent(region, data) {
      const current = data.current;
      const daily = data.daily;
      const info = getWeatherInfo(current.weather_code);
      const rainIndex = daily.time.indexOf(current.time.slice(0, 10));
      const rainChance = rainIndex >= 0 ? daily.precipitation_probability_max[rainIndex] : null;

      currentPanel.innerHTML = `
        <h2 class="region-name">${region.name}</h2>
        <div class="weather-state">${info[0]}</div>
        <div class="temperature-row">
          <div class="weather-icon" aria-hidden="true">${info[1]}</div>
          <div>
            <div class="temperature">${formatNumber(current.temperature_2m)}°</div>
            <div class="feels">체감 ${formatNumber(current.apparent_temperature)}°</div>
          </div>
        </div>
        <div class="metrics">
          <div class="metric"><span>습도</span><strong>${formatNumber(current.relative_humidity_2m)}%</strong></div>
          <div class="metric"><span>바람</span><strong>${formatNumber(current.wind_speed_10m)} km/h</strong></div>
          <div class="metric"><span>강수량</span><strong>${formatNumber(current.precipitation)} mm</strong></div>
          <div class="metric"><span>강수확률</span><strong>${formatNumber(rainChance)}%</strong></div>
        </div>
      `;
    }

    function renderToday(data) {
      const now = new Date();
      const today = data.current.time.slice(0, 10);
      const items = data.hourly.time
        .map((time, index) => ({
          time,
          temp: data.hourly.temperature_2m[index],
          code: data.hourly.weather_code[index],
          pop: data.hourly.precipitation_probability[index],
          wind: data.hourly.wind_speed_10m[index]
        }))
        .filter((item) => item.time.startsWith(today) && new Date(item.time) >= now)
        .slice(0, 8);

      if (!items.length) {
        todayView.innerHTML = `<div class="status">남은 오늘 시간대 예보가 없습니다.</div>`;
        return;
      }

      todayView.innerHTML = `
        <div class="today-list">
          ${items.map((item) => {
            const info = getWeatherInfo(item.code);
            return `
              <div class="detail-row">
                <div class="time">${formatHour(item.time)}</div>
                <div class="small-state"><span aria-hidden="true">${info[1]}</span><b>${info[0]}</b></div>
                <div class="chip">${formatNumber(item.temp)}° · 강수 ${formatNumber(item.pop)}% · 바람 ${formatNumber(item.wind)}km/h</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderWeek(data) {
      weekView.innerHTML = `
        <div class="forecast-list">
          ${data.daily.time.map((day, index) => {
            const info = getWeatherInfo(data.daily.weather_code[index]);
            const max = data.daily.temperature_2m_max[index];
            const min = data.daily.temperature_2m_min[index];
            const pop = data.daily.precipitation_probability_max[index];
            return `
              <div class="forecast-row">
                <div class="time">${formatDay(day)}</div>
                <div class="small-state"><span aria-hidden="true">${info[1]}</span><b>${info[0]}</b></div>
                <div class="chip">${formatNumber(min)}° / ${formatNumber(max)}° · 강수 ${formatNumber(pop)}%</div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    async function fetchWeather(region) {
      const params = new URLSearchParams({
        latitude: region.lat,
        longitude: region.lon,
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m",
        hourly: "temperature_2m,precipitation_probability,weather_code,wind_speed_10m",
        daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max",
        timezone: "Asia/Seoul",
        forecast_days: "7"
      });
      const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
      if (!response.ok) {
        throw new Error("날씨 API 응답이 올바르지 않습니다.");
      }
      return response.json();
    }

    async function selectRegion(region) {
      selectedRegion = region;
      setActiveMarker(region);
      setLoading(region);

      try {
        const data = await fetchWeather(region);
        renderCurrent(region, data);
        renderToday(data);
        renderWeek(data);
        updatedText.textContent = `${region.name} 기준 · ${new Date().toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" })} 갱신`;
      } catch (error) {
        setError(region, "날씨 데이터를 불러오지 못했습니다.");
      }
    }

    document.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((item) => {
          const isActive = item === tab;
          item.classList.toggle("active", isActive);
          item.setAttribute("aria-selected", String(isActive));
        });
        document.querySelectorAll(".tab-view").forEach((view) => {
          view.classList.toggle("active", view.id === `${tab.dataset.tab}View`);
        });
      });
    });

    buildRegionList();
    buildMap();
    selectRegion(selectedRegion);
  </script>
</body>
</html>
